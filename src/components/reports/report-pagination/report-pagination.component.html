@if (total() > 0) {
  <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-3 text-sm text-gray-600">
    <div class="flex items-center gap-2">
      <span>Rows per page</span>
      <select [ngModel]="pageSize()" (ngModelChange)="onPageSizeChange($event)"
              class="px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
        @for (size of pageSizeOptions(); track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </div>
    <div>Showing {{ rangeStart() }}–{{ rangeEnd() }} of {{ total() }}</div>
    <div class="flex items-center gap-2">
      <button type="button" (click)="goPrev()" [disabled]="page() <= 1"
              class="px-3 py-1.5 rounded-md border border-gray-300 bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50">
        Prev
      </button>
      <span>Page {{ page() }} of {{ totalPages() }}</span>
      <button type="button" (click)="goNext()" [disabled]="page() >= totalPages()"
              class="px-3 py-1.5 rounded-md border border-gray-300 bg-white disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50">
        Next
      </button>
    </div>
  </div>
}
